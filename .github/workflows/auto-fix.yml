name: auto-fix
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  autofix:
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - run: pnpm i --frozen-lockfile=false
      - run: pnpm lint:perf:fix

      - name: Create PR with fixes
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: auto-fix lint/perf issues"
          title: "chore: auto-fix lint/perf issues"
          body: |
            This PR applies auto-fixable lint/performance rules.
            Please review and merge if acceptable.
          branch: auto-fix/${{ github.head_ref || 'manual' }}
          base: ${{ github.head_ref || 'main' }}
