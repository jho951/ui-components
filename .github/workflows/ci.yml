name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  storybook-guard:
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Storybook is removed on main
        run: |
          if [ -d "storybook" ]; then
            echo "storybook/ directory must not exist on main."
            exit 1
          fi

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Use the pnpm version pinned in package.json#packageManager (e.g. pnpm@9.12.3)
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install deps
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install
          fi
      - run: pnpm typecheck
      - run: pnpm lint:perf
      - run: pnpm -C packages build
      - run: pnpm size
      - run: pnpm audit:prod
